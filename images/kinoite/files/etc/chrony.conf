# Box clock: sync to the gateway, not the public pool. Boxes have no internet, so the stock
# `pool 2.fedora.pool.ntp.org` never answered and each box free-ran on its own RTC.
# The gateway serves time to the backbone even when it is itself offline
# (gateway-setup.sh: `local stratum 10`), so the fleet agrees with each other either way.
# Replaces Fedora's whole /etc/chrony.conf: chrony there has no /etc/chrony.d include.
server 10.10.0.69 iburst

driftfile /var/lib/chrony/drift
# Step at startup if off by >1s (first 3 updates), slew afterwards so a running
# acquisition never sees time jump.
makestep 1.0 3
rtcsync
ntsdumpdir /var/lib/chrony
leapseclist /usr/share/zoneinfo/leap-seconds.list
logdir /var/log/chrony
